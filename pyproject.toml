[project]
name = "charmer-bot"
version = "0.1.0"
description = "Discord bot for random things"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7",
    "aiofiles>=24.1",
    "aiohttp>=3.10",
    "asyncpg>=0.29",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["bot", "main.py"]
